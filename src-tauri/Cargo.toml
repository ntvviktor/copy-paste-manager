[package]
name = "clipvim"
version = "0.1.0"
description = "Vim-navigable clipboard history popup"
authors = ["viktorngo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clipvim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.6.1", features = ["image-data"] }
enigo = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
base64 = "0.22"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
objc = "0.2.7"

# Required by tauri-nspanel
[features]
cargo-clippy = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
